name: Build and deploy

on:
  schedule:
    # Hourly. GitHub can delay scheduled runs under load, so the site always
    # prints the build time it actually ran at rather than implying "1 hour".
    - cron: '7 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

# Deliberately read-only at the top level. The build job parses HTML and JSON
# from three cinema sites it does not control, so it is the one job an attacker
# could plausibly reach — and it must not be able to write to the repository or
# publish to Pages. The jobs that need write access are separate, tiny, and
# touch no untrusted input.
permissions:
  contents: read

# Never let two refreshes deploy over each other.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Read by the alert job below, which has no other way to learn whether
    # this run's scrapes actually succeeded.
    outputs:
      degraded: ${{ steps.health.outputs.degraded }}
      body: ${{ steps.health.outputs.body }}
    steps:
      # Actions are pinned to commit SHAs rather than floating tags: a tag can
      # be moved to point at new code, so `@v4` is a standing invitation to run
      # whatever that tag means tomorrow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      # No dependency in the lockfile declares an install script (verified:
      # zero `hasInstallScript` entries), so refusing to run them costs nothing
      # and closes the usual npm supply-chain path.
      - run: npm ci --ignore-scripts

      # CineStar is behind a Cloudflare managed challenge that fingerprints the
      # TLS handshake, so Node's fetch is refused from the runner no matter what
      # headers it sends. curl_cffi replays a real Chrome handshake and is the
      # only method measured to get through. The build degrades to CineStar's
      # last good data if this step ever fails, so it must not be fatal.
      # Pinned: this installs a native binary into the build, so "latest" is a
      # dependency on whatever was published this morning.
      - name: Install curl_cffi (CineStar TLS fallback)
        continue-on-error: true
        run: pip install --quiet 'curl_cffi==0.16.0'

      - run: npm test

      - run: npm run build
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          # Accepts either, so this keeps working whether the key is stored as a
          # variable (as it was) or promoted to a secret.
          CINEPLEXX_CLIENT_KEY: ${{ secrets.CINEPLEXX_CLIENT_KEY || vars.CINEPLEXX_CLIENT_KEY }}

      # A source going stale is invisible from outside: R-11.2's fallback keeps
      # the site looking fine to readers even while a scraper is broken. This
      # reads dist/data.json (already compiled by `npm run build`) and hands
      # the alert job below a plain summary, so that job never needs its own
      # checkout or network access to the cinema sites.
      - name: Check source health
        id: health
        run: node lib/alert.js

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

      # Handed to the persist job rather than committed here, so that the job
      # holding `contents: write` never runs the scraper. health.json tracks
      # each source's consecutive-failure streak so the alert job below only
      # fires on a repeat failure, never a single blip (R-11.8, R-11.9).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: raw-data
          path: |
            data/raw.json
            data/health.json
          retention-days: 1

  # The last good scrape is committed so the next run can fall back to it when a
  # cinema is down. It also keeps the scheduled workflow alive, which GitHub
  # disables after 60 days without repository activity — so this commit is load
  # bearing and cannot be replaced with a cache.
  persist:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: raw-data
          path: data

      - name: Commit refreshed source data
        continue-on-error: true
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/raw.json data/health.json
          git diff --staged --quiet || git commit -m 'chore: refresh scraped data'
          git push

  # Depends on build alone, never on persist: a failed commit must not be able
  # to hold back a good site.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  # A degraded source (R-11.2's stale fallback) never fails the build and never
  # shows up outside the site's own footer, so without this a maintainer only
  # learns a scraper broke by noticing the UI or reading the Actions log
  # (R-11.8). src/alert.ts only counts a source once it has failed two builds
  # in a row (health.json), so one transient blip never opens an issue. This
  # opens one tracking issue per outage and closes it again once a later run
  # comes back healthy — deliberately independent of persist/deploy, so a
  # broken alert can never hold back a good site.
  alert:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or close the source-health issue
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEGRADED: ${{ needs.build.outputs.degraded }}
          BODY: ${{ needs.build.outputs.body }}
        run: |
          set -e
          repo="$REPO"
          gh label create source-down --repo "$repo" --color d73a4a \
            --description 'A cinema source failed to refresh data' --force
          existing=$(gh issue list --repo "$repo" --label source-down --state open \
            --json number --jq '.[0].number // empty')

          if [ "$DEGRADED" = 'true' ]; then
            if [ -n "$existing" ]; then
              gh issue edit "$existing" --repo "$repo" --body "$BODY"
            else
              gh issue create --repo "$repo" --title 'Izvor ne osvežava podatke' \
                --label source-down --body "$BODY"
            fi
          elif [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$repo" \
              --body 'Svi izvori su ponovo uspešno osvežili podatke.'
            gh issue close "$existing" --repo "$repo"
          fi

