name: Build and deploy

on:
  schedule:
    # Hourly. GitHub can delay scheduled runs under load, so the site always
    # prints the build time it actually ran at rather than implying "1 hour".
    - cron: '7 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Never let two refreshes deploy over each other.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run build
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          CINEPLEXX_CLIENT_KEY: ${{ vars.CINEPLEXX_CLIENT_KEY }}

      # The last good scrape is committed so the next run can fall back to it
      # when a cinema is down. It also keeps the scheduled workflow alive, which
      # GitHub disables after 60 days without repository activity.
      - name: Commit refreshed source data
        continue-on-error: true
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/raw.json
          git diff --staged --quiet || git commit -m 'chore: refresh scraped data'
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
